# Скриншоты приложения из симулятора iPhone. Запуск вручную:
# вкладка Actions → Screenshots → Run workflow. Результат коммитится в docs/screenshots.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Выбор Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kvartet.xcodeproj \
            -scheme Kvartet \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -5

      - name: Скриншоты
        run: |
          chmod +x scripts/screenshots.sh
          scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/Kvartet.app docs/screenshots

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Скриншоты не изменились"
            exit 0
          fi
          git commit -m "Update screenshots [skip ci]"
          git pull --rebase
          git push
