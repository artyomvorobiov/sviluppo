# Сборка Android-версии. Готовый APK — во вкладке Actions → Android build → нужный запуск → Artifacts.
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/kvartet.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/kvartet-debug.apk
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: kvartet-apk
          path: apk/*.apk
          retention-days: 30
