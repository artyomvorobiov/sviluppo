# Временная проверка: как iTunes Search API отвечает на разные варианты запросов.
name: iTunes probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Запросы
        run: |
          probe() {
            local url="https://itunes.apple.com/$1"
            local code
            code=$(curl -s -o r.json -w "%{http_code}" -A "Kvartet/1.0 (iOS app)" "$url" || echo 000)
            python3 - "$code" "$1" <<'EOF'
          import json, sys
          code, query = sys.argv[1], sys.argv[2]
          try:
              d = json.load(open("r.json"))
              rows = d["results"]
              interesting = [r for r in rows if r.get("kind") == "feature-movie" or "emma" in (r.get("collectionName") or "").lower()]
              names = [f'{r.get("kind") or r.get("wrapperType")}: {r.get("artistName")} — track={r.get("trackName")!r} collection={r.get("collectionName")!r} ({(r.get("releaseDate") or "")[:4]}) art={bool(r.get("artworkUrl100"))} preview={bool(r.get("previewUrl"))}' for r in (interesting or rows)[:6]]
              print(f"{code} | {d['resultCount']:>3} | {query}")
              for n in names:
                  print(f"           {n}")
          except Exception as e:
              print(f"{code} | ERR {e} | {query}")
          EOF
            sleep 3
          }
          probe "search?term=Fargo&entity=movie&country=us&limit=10"
          probe "search?term=Fargo&media=all&entity=movie&country=us&limit=10"
          probe "search?term=Fargo&country=us&limit=50"
          probe "search?term=Psycho&country=us&limit=50"
          probe "search?term=The%20Wind%20Rises&country=us&limit=50"
          probe "search?term=Into%20Great%20Silence&country=us&limit=50"
          probe "search?term=Metropolis&country=us&limit=50"
          probe "search?term=Persona&country=us&limit=50"
          probe "search?term=Bon%20Iver&media=music&entity=album&attribute=artistTerm&country=us&limit=200"
          probe "search?term=For%20Emma%20Forever%20Ago%20Bon%20Iver&media=music&entity=album&country=us&limit=10"
          probe "search?term=%D0%A4%D0%B0%D1%80%D0%B3%D0%BE&country=ru&limit=50"
          probe "search?term=%D0%AF%20%D1%88%D0%B0%D0%B3%D0%B0%D1%8E%20%D0%BF%D0%BE%20%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B5&country=ru&limit=50"
