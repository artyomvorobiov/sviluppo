# Временная проверка: как iTunes Search API отвечает на разные варианты запросов.
name: iTunes probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Запросы
        run: |
          probe() {
            local url="https://itunes.apple.com/$1"
            local code
            code=$(curl -s -o r.json -w "%{http_code}" -A "Kvartet/1.0 (iOS app)" "$url" || echo 000)
            python3 - "$code" "$1" <<'EOF'
          import json, sys
          code, query = sys.argv[1], sys.argv[2]
          try:
              d = json.load(open("r.json"))
              names = [f'{r.get("artistName")} — {r.get("collectionName") or r.get("trackName")} ({(r.get("releaseDate") or "")[:4]}, {r.get("kind") or r.get("wrapperType")})' for r in d["results"][:4]]
              print(f"{code} | {d['resultCount']:>3} | {query}")
              for n in names:
                  print(f"           {n}")
          except Exception as e:
              print(f"{code} | ERR {e} | {query}")
          EOF
            sleep 3
          }
          probe "search?term=Fargo&media=movie&entity=movie&country=us&limit=5"
          probe "search?term=fargo&media=movie&country=us&limit=5"
          probe "search?term=Fargo&country=us&limit=5"
          probe "search?term=Fargo%201996&media=movie&entity=movie&country=us&limit=5"
          probe "search?term=Fargo&media=movie&entity=movie&attribute=movieTerm&country=us&limit=5"
          probe "search?term=Coen&media=movie&entity=movie&attribute=directorTerm&country=us&limit=5"
          probe "search?term=Into%20Great%20Silence&media=movie&entity=movie&country=us&limit=5"
          probe "search?term=The%20Wind%20Rises&media=movie&entity=movie&country=us&limit=5"
          probe "search?term=Psycho&media=movie&entity=movie&country=us&limit=5"
          probe "search?term=Bon%20Iver%20For%20Emma%2C%20Forever%20Ago&media=music&entity=album&country=us&limit=5"
          probe "search?term=Bon%20Iver%20For%20Emma%20Forever%20Ago&media=music&entity=album&country=us&limit=5"
          probe "search?term=For%20Emma%2C%20Forever%20Ago&media=music&entity=album&country=us&limit=5"
          probe "search?term=Bon%20Iver&media=music&entity=album&attribute=artistTerm&country=us&limit=5"
          probe "search?term=Nils%20Frahm%20Felt&media=music&entity=album&country=us&limit=5"
          probe "search?term=Bon%20Iver%20Skinny%20Love&media=music&entity=song&country=us&limit=5"
          probe "search?term=Miles%20Davis%20Kind%20of%20Blue&media=music&entity=album&country=us&limit=5"
          probe "search?term=Fargo&media=movie&entity=movie&country=gb&limit=5"
          probe "search?term=%D0%A4%D0%B0%D1%80%D0%B3%D0%BE&media=movie&entity=movie&country=ru&limit=5"
