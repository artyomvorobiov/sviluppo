# Скриншоты Android-версии из эмулятора. Запуск вручную:
# вкладка Actions → Android screenshots → Run workflow. Результат коммитится в docs/screenshots/android.
name: Android screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m pip install --quiet pillow

      - name: Скриншоты
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-screenshots.sh android/app/build/outputs/apk/debug/app-debug.apk docs/screenshots/android

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/android
          if git diff --cached --quiet; then
            echo "Скриншоты не изменились"
            exit 0
          fi
          git commit -m "Update Android screenshots [skip ci]"
          git pull --rebase
          git push
